name: Android APK Reverse Engineering & Analysis

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      gdrive_file_id:
        description: 'Google Drive File ID APK'
        required: true
        default: '1C-NwLMSWaEOZaHzaxdmonRzFnBs2wBxU'
        type: string

jobs:
  analyze-apk:
    name: Decompile and Analyze APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies (gdown, Apktool, zip, file, jq)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            wget \
            unzip \
            zip \
            file \
            jq \
            python3-pip

          # Install gdown untuk menangani unduhan file besar Google Drive (bypass virus scan warning)
          pip3 install --no-cache-dir --break-system-packages gdown

          # Install Apktool versi terbaru dari GitHub Releases resmi
          APKTOOL_TAG=$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | jq -r '.tag_name')
          if [ -z "$APKTOOL_TAG" ] || [ "$APKTOOL_TAG" = "null" ]; then
            echo "::error::Gagal mengambil versi terbaru Apktool dari GitHub API."
            exit 1
          fi
          APKTOOL_VER="${APKTOOL_TAG#v}"

          sudo mkdir -p /usr/local/bin
          curl -fsSL "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool" -o /tmp/apktool
          curl -fsSL "https://github.com/iBotPeaches/Apktool/releases/download/${APKTOOL_TAG}/apktool_${APKTOOL_VER}.jar" -o /tmp/apktool.jar

          sudo mv /tmp/apktool /usr/local/bin/apktool
          sudo mv /tmp/apktool.jar /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool

          apktool --version

      - name: Download & setup latest JADX
        run: |
          set -euo pipefail
          JADX_JSON=$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest)
          JADX_TAG=$(echo "$JADX_JSON" | jq -r '.tag_name')

          if [ -z "$JADX_TAG" ] || [ "$JADX_TAG" = "null" ]; then
            echo "::error::Gagal mengambil metadata rilis terbaru JADX."
            exit 1
          fi

          JADX_VER="${JADX_TAG#v}"
          JADX_URL="https://github.com/skylot/jadx/releases/download/${JADX_TAG}/jadx-${JADX_VER}.zip"

          echo "Mengunduh JADX ${JADX_TAG} dari ${JADX_URL}..."
          curl -fsSL "$JADX_URL" -o /tmp/jadx.zip

          sudo mkdir -p /opt/jadx
          sudo unzip -q /tmp/jadx.zip -d /opt/jadx
          sudo chmod +x /opt/jadx/bin/jadx /opt/jadx/bin/jadx-gui
          sudo ln -sf /opt/jadx/bin/jadx /usr/local/bin/jadx
          rm -f /tmp/jadx.zip

          jadx --version

      - name: Download APK from Google Drive
        env:
          FILE_ID: ${{ github.event.inputs.gdrive_file_id || '1C-NwLMSWaEOZaHzaxdmonRzFnBs2wBxU' }}
        run: |
          set -euo pipefail
          echo "Mengunduh APK dengan File ID: ${FILE_ID}..."

          if ! gdown --id "${FILE_ID}" -O target.apk; then
            echo "::error::Gagal mengunduh file dari Google Drive. Pastikan izin akses diatur ke 'Anyone with the link - Viewer'."
            exit 1
          fi

          if [ ! -f target.apk ]; then
            echo "::error::File target.apk tidak ditemukan setelah proses unduhan."
            exit 1
          fi

      - name: Validate downloaded APK file
        run: |
          set -euo pipefail
          FILE_SIZE=$(stat -c%s target.apk)
          FILE_MIME=$(file --mime-type -b target.apk)

          echo "Ukuran file: ${FILE_SIZE} bytes"
          echo "Tipe MIME terdeteksi: ${FILE_MIME}"

          # Tolak jika ukuran file terlalu kecil (< 100 KB, indikasi halaman error HTML)
          if [ "$FILE_SIZE" -lt 102400 ]; then
            echo "::error::Ukuran file terlalu kecil (${FILE_SIZE} bytes). Kemungkinan gagal mengunduh APK."
            head -n 20 target.apk || true
            exit 1
          fi

          # Tolak jika file adalah HTML atau teks
          if [[ "$FILE_MIME" == text/* ]] || grep -qi "<html" <(head -c 512 target.apk | tr -d '\0'); then
            echo "::error::File yang diunduh adalah halaman HTML, bukan binary APK."
            exit 1
          fi

          # APK harus berupa arsip ZIP valid dan memuat AndroidManifest.xml
          if ! unzip -tq target.apk >/dev/null 2>&1; then
            echo "::error::File target.apk rusak atau bukan arsip ZIP/APK yang valid."
            exit 1
          fi

          if ! unzip -l target.apk | grep -q "AndroidManifest.xml"; then
            echo "::error::Arsip tidak mengandung AndroidManifest.xml. File bukan APK Android valid."
            exit 1
          fi

          echo "Validasi berhasil: target.apk adalah APK Android yang valid."

      - name: Prepare output directories
        run: |
          set -euo pipefail
          rm -rf APK-Analysis APK-Analysis-Results.zip
          mkdir -p APK-Analysis/JADX APK-Analysis/APKTOOL

      - name: Decompile APK with Apktool
        run: |
          set -euo pipefail
          echo "Menjalankan Apktool..."
          if ! apktool d -f target.apk -o APK-Analysis/APKTOOL; then
            echo "::error::Proses dekompilasi Apktool gagal."
            exit 1
          fi

          if [ ! -f "APK-Analysis/APKTOOL/AndroidManifest.xml" ]; then
            echo "::error::Output Apktool tidak lengkap (AndroidManifest.xml tidak ditemukan)."
            exit 1
          fi

      - name: Decompile APK with JADX
        run: |
          set -euo pipefail
          echo "Menjalankan JADX..."
          # JADX bisa mengembalikan exit code 1 jika ada sebagian kecil kelas gagal didekompilasi,
          # sehingga kita verifikasi direktori output sources/resources setelah eksekusi.
          set +e
          jadx \
            --deobf \
            --show-bad-code \
            --threads-count "$(nproc)" \
            -d APK-Analysis/JADX \
            target.apk
          JADX_EXIT=$?
          set -e

          echo "JADX selesai dengan exit code: ${JADX_EXIT}"

          if [ ! -d "APK-Analysis/JADX/sources" ] && [ ! -d "APK-Analysis/JADX/resources" ]; then
            echo "::error::JADX gagal menghasilkan source code maupun resources."
            exit 1
          fi

      - name: Generate analysis report
        if: always()
        run: |
          set -euo pipefail
          mkdir -p APK-Analysis
          REPORT="APK-Analysis/analysis-report.txt"

          {
            echo "========================================================"
            echo "ANDROID APK REVERSE ENGINEERING & ANALYSIS REPORT"
            echo "========================================================"
            echo "Repository     : ${{ github.repository }}"
            echo "Branch         : ${{ github.ref_name }}"
            echo "Run ID         : ${{ github.run_id }}"
            echo "Timestamp (UTC): $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "GDrive File ID : ${{ github.event.inputs.gdrive_file_id || '1C-NwLMSWaEOZaHzaxdmonRzFnBs2wBxU' }}"
            echo ""
            echo "--- TOOL VERSIONS ---"
            echo "Java           : $(java -version 2>&1 | head -n 1)"
            echo "Apktool        : $(apktool --version 2>/dev/null || echo 'N/A')"
            echo "JADX           : $(jadx --version 2>/dev/null || echo 'N/A')"
            echo ""
            echo "--- APK FILE METADATA ---"
            if [ -f target.apk ]; then
              echo "File Size      : $(stat -c%s target.apk) bytes ($(du -h target.apk | cut -f1))"
              echo "SHA-256        : $(sha256sum target.apk | awk '{print $1}')"
              echo "MD5            : $(md5sum target.apk | awk '{print $1}')"
            else
              echo "Status         : target.apk tidak tersedia (gagal diunduh)"
            fi
            echo ""
            echo "--- DECOMPILATION SUMMARY ---"
            if [ -d "APK-Analysis/JADX" ]; then
              JAVA_COUNT=$(find APK-Analysis/JADX -type f -name "*.java" | wc -l)
              echo "JADX Java Files: ${JAVA_COUNT}"
            else
              echo "JADX Output    : Tidak tersedia"
            fi

            if [ -d "APK-Analysis/APKTOOL" ]; then
              SMALI_COUNT=$(find APK-Analysis/APKTOOL -type f -name "*.smali" | wc -l)
              XML_COUNT=$(find APK-Analysis/APKTOOL -type f -name "*.xml" | wc -l)
              echo "Smali Files    : ${SMALI_COUNT}"
              echo "XML Files      : ${XML_COUNT}"
            else
              echo "Apktool Output : Tidak tersedia"
            fi

            if [ -f "APK-Analysis/APKTOOL/apktool.yml" ]; then
              echo ""
              echo "--- APKTOOL.YML INFO ---"
              cat APK-Analysis/APKTOOL/apktool.yml
            fi
          } > "$REPORT"

          cat "$REPORT"

      - name: Compress analysis results into ZIP
        run: |
          set -euo pipefail
          if [ ! -d "APK-Analysis" ]; then
            echo "::error::Direktori APK-Analysis tidak ditemukan untuk dikompres."
            exit 1
          fi

          if ! zip -rq APK-Analysis-Results.zip APK-Analysis; then
            echo "::error::Gagal membuat file arsip APK-Analysis-Results.zip."
            exit 1
          fi

          if [ ! -f "APK-Analysis-Results.zip" ]; then
            echo "::error::File APK-Analysis-Results.zip tidak terbentuk."
            exit 1
          fi

          echo "Berhasil membuat APK-Analysis-Results.zip ($(du -h APK-Analysis-Results.zip | cut -f1))"

      - name: Upload APK-Analysis-Results.zip as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-Analysis-Results
          path: APK-Analysis-Results.zip
          retention-days: 30
          if-no-files-found: error
